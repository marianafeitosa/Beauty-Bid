server:
  port: 8080


spring:

  application:
    name: api-gateway

  main:
    web-application-type: reactive


  cloud:

    gateway:

      server:

        webflux:

          globalcors:

            add-to-simple-url-handler-mapping: true

            cors-configurations:

              '[/**]':

                allowedOrigins:
                  - "http://localhost:5173"

                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS

                allowedHeaders:
                  - "*"

                allowCredentials: true


          routes:

            # =====================================
            # LOGIN
            # =====================================

            - id: login-service

              uri: http://localhost:8081

              predicates:
                - Path=/api/auth/**

              filters:
                - StripPrefix=1


            # =====================================
            # VENDAS / LEILÕES
            # =====================================

            - id: vendas-service

              uri: http://localhost:8082

              predicates:
                - Path=/api/leiloes/**

              filters:
                - StripPrefix=1


            # =====================================
            # TRANSAÇÕES
            # =====================================

            - id: transacao-service

              uri: http://localhost:8083

              predicates:
                - Path=/api/transacoes/**

              filters:
                - StripPrefix=1


            # =====================================
            # RELATÓRIOS
            # =====================================

            - id: relatorio-service

              uri: http://localhost:8084

              predicates:
                - Path=/api/relatorios/**

              filters:
                - StripPrefix=1


jwt:

  secret: minha-chave-super-secreta-do-leilao-com-mais-de-32-caracteres