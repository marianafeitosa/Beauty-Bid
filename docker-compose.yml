services:

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  mongo-login:
    image: mongo:7
    ports:
      - "27017:27017"

  mongo-vendas:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27018:27017"
    healthcheck:
      test: >
        echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}) }"
        | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 30s
      retries: 30

  mongo-transacao:
    image: mongo:7
    command: ["--replSet", "rs1", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27019:27017"
    healthcheck:
      test: >
        echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs1',members:[{_id:0,host:'localhost:27017'}]}) }"
        | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 30s
      retries: 30

  mongo-relatorio:
    image: mongo:7
    ports:
      - "27020:27017"